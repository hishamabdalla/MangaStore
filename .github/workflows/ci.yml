name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore dotnet tools
        run: dotnet tool restore

      - name: Restore dependencies
        run: dotnet restore

      - name: Build (warnings as errors)
        run: dotnet build --no-restore -p:TreatWarningsAsErrors=true

      # Model/migration drift on a schema holding money and sellable inventory is the kind of bug
      # that surfaces in production at the worst possible moment.
      - name: Check for model/migration drift
        run: dotnet ef migrations has-pending-model-changes --project src/MangaStore.Infrastructure --startup-project src/MangaStore.API

      - name: Test
        run: dotnet test --no-build --verbosity normal
